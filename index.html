<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baguetty Links</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root {
    --bg: #0a0a0a;
    --bg-soft: #121212;
    --card: rgba(255,255,255,0.04);
    --text: #f5f5f5;
    --accent: #14b8a6;
    --border: rgba(255,255,255,0.08);
}

.light {
    --bg: #f5f7fb;
    --bg-soft: #ffffff;
    --card: rgba(15, 23, 42, 0.05);
    --text: #111827;
    --accent: #0f766e;
    --border: rgba(15, 23, 42, 0.1);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    padding: 20px;
    overflow: hidden;
}

.container {
    width: 100%;
    min-width: 280px;
    max-width: 800px;
    text-align: center;
}

.glass {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    position: relative;
}

/* Neon border glow */
.glass {
    position: relative;
    isolation: isolate;
}

.glass::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 20px;
    border: 2px solid rgba(20, 184, 166, 0.45);
    box-shadow:
        0 0 0 1px rgba(20, 184, 166, 0.1),
        0 0 90px rgba(20, 184, 166, 0.24),
        0 0 70px rgba(20, 184, 166, 0.12),
        0 0 90px rgba(20, 184, 166, 0.06);
    opacity: 0;
    transition: opacity 0.25s ease;
    z-index: -1;
    pointer-events: none;
}

.glass:hover::before {
    opacity: 0.95;
}

.glass::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: rgba(255,255,255,0.02);
    z-index: -2;
}

.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    margin-bottom: 10px;
    transition: transform 0.25s ease;
}

.avatar:hover {
    animation: bounceUpDown 0.45s ease-in-out infinite alternate;
}

@keyframes bounceUpDown {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-6px);
    }
}

.username {
    margin: 0 0 6px;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(20, 184, 166, 0.35);
    cursor: default;
    transition: transform 0.2s ease, font-size 0.2s ease;
}

.username:hover {
    transform: scale(1.03);
    font-size: 0.98rem;
}

.bio {
    margin: 0 0 18px;
    font-size: 0.8rem;
    line-height: 1.5;
    color: var(--text);
    opacity: 0.9;
    transition: transform 0.2s ease, font-size 0.2s ease;
    cursor: default;
}

.bio:hover {
    /* transform: scale(1.03); */
    /* font-size: 0.83rem; */
}

.socials {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 20px 0;
}

.socials a {
    color: var(--text);
    font-size: 24px;
    transition: 0.3s;
}

.socials a:hover {
    color: var(--accent);
    transform: scale(1.2);
}

.links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 400px;
    overflow-y: auto;
    padding: 6px 8px 6px 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(20, 184, 166, 0.7) transparent;
}

.links::-webkit-scrollbar {
    width: 8px;
}

.links::-webkit-scrollbar-track {
    background: transparent;
}

.links::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, rgba(20, 184, 166, 0.9), rgba(20, 184, 166, 0.45));
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 8px rgba(20, 184, 166, 0.25);
}

.link-item {
    display: flex;
    align-items: center;
    min-height: 50px;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    flex-shrink: 0;
}

.link-item::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    border: 0px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(20, 184, 166, 0.2);
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
}

.link-item:hover {
    transform: translateY(-3px);
}

.link-item:hover::before {
    opacity: 1;
    box-shadow: inset 0 0 0 1px rgba(20, 184, 166, 0.8), 0 0 12px rgba(20, 184, 166, 0.45);
}

.link-icon {
    width: 30px;
}

.link-text {
    flex: 1;
    text-align: center;
    font-weight: 600;
}

/* Toggle */
.toggle {
    position: absolute;
    top: 20px;
    right: 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--accent);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(20, 184, 166, 0.15);
    transition: 0.3s;
}

.toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 0 14px rgba(20, 184, 166, 0.25);
}

/* Responsive */
@media (max-width: 480px) {
    .container {
        padding: 10px;
    }
}
</style>
</head>

<body>

<button class="toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
    <i class="fas fa-adjust"></i>
</button>

<div class="container glass">

    <img src="assets/avatar.jpg" class="avatar">
    <p class="username">@baguetty</p>
    <p class="bio">Hi, My name is Christ, Once Human grinder &amp; theorycrafter</p>

    <div class="socials">
        <a href="https://www.youtube.com/@baguetty"><i class="fab fa-youtube"></i></a>
        <a href="https://www.twitch.tv/christwhite96"><i class="fab fa-twitch"></i></a>
        <a href="https://discordapp.com/users/203894904907104257"><i class="fab fa-discord"></i></a>
    </div>

    <div class="links">
        <a href="https://thachvn0296.github.io/OHTimer/" class="link-item">
            <div class="link-icon"><i class="fas fa-robot"></i></div>
            <div class="link-text">Once Human Discord's Reset Timer Bot - Invite Link</div>
        </a>

        <a href="https://github.com/thachvn0296/OHTimer" class="link-item">
            <div class="link-icon"><i class="fas fa-globe"></i></div>
            <div class="link-text">Once Human Reset Timer Bot - Source Code</div>
        </a>

        <a href="https://oh-calculator.vercel.app/" class="link-item">
            <div class="link-icon"><i class="fa-solid fa-wrench"></i></div>
            <div class="link-text">Once Human - Damage Calculator</div>
        </a>

        <a href="https://thachvn0296.github.io/OH-Starfall-Daily-Tracker/OH%20Timer.html" class="link-item">
            <div class="link-icon"><i class="fa-solid fa-wrench"></i></div>
            <div class="link-text">Once Human - S4 Starfall Daily Tracker</div>
        </a>

        <a href="https://docs.google.com/spreadsheets/d/1i2mwQgR5f7RE0r-GEv3peS3I6hh5LQtt/edit?gid=1880848336#gid=1880848336" class="link-item">
            <div class="link-icon"><i class="fas fa-file-lines"></i></div>
            <div class="link-text">Once Human Ebook - General info and In-game Formulas</div>
        </a>
    </div>

</div>

<script>
function applyTheme(theme) {
    document.body.classList.toggle('light', theme === 'light');
    localStorage.setItem('theme', theme);
    const toggleIcon = document.querySelector('.toggle i');
    if (toggleIcon) {
        toggleIcon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-adjust';
    }
}

function toggleTheme() {
    const isLight = document.body.classList.contains('light');
    applyTheme(isLight ? 'dark' : 'light');
}

const savedTheme = localStorage.getItem('theme');
applyTheme(savedTheme === 'light' ? 'light' : 'dark');
</script>

</body>
</html>
