<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baguetty Links</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --bg-soft: #121212;
            --card: rgba(255, 255, 255, 0.04);
            --text: #f5f5f5;
            --accent: #14b8a6;
            --border: rgba(255, 255, 255, 0.08);
        }

        .light {
            --bg: #f5f7fb;
            --bg-soft: #ffffff;
            --card: rgba(15, 23, 42, 0.05);
            --text: #111827;
            --accent: #0f766e;
            --border: rgba(15, 23, 42, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            min-width: 280px;
            max-width: 800px;
            text-align: center;
        }

        .glass {
            background: var(--bg-soft);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            position: relative;
        }

        /* Neon border glow */
        .glass {
            position: relative;
            isolation: isolate;
            border-radius: 18px;
            padding: 0;
        }

        .sub-container {
            position: relative;
            z-index: 1;
            margin: 0;
            padding: 24px;
            background: var(--bg-soft);
            border-radius: 18px;
            min-height: 100%;
        }

        .glass::before,
        .glass::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 20px;
            z-index: -1;
            pointer-events: none;
        }

        .glass::before {
            background: linear-gradient(var(--rotate, 132deg), #5ddcff, #14b8a6 43%, #0f766e);
            animation: spin 2.5s linear infinite;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .glass::after {
            inset: 6px;
            background: linear-gradient(var(--rotate, 132deg), #5ddcff, #14b8a6 43%, #0f766e);
            filter: blur(18px);
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.25s ease;
        }

        .glass:hover::before,
        .glass:hover::after {
            opacity: 1;
        }

        @property --rotate {
            syntax: "<angle>";
            initial-value: 132deg;
            inherits: false;
        }

        @keyframes spin {
            0% {
                --rotate: 0deg;
            }

            100% {
                --rotate: 360deg;
            }
        }

        .glass::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            z-index: -2;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid transparent;
            padding: 2px;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            object-fit: cover;
            background:
                linear-gradient(var(--bg-soft), var(--bg-soft)) padding-box,
                linear-gradient(var(--rotate, 132deg), #5ddcff, #14b8a6 43%, #0f766e) border-box;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-sizing: border-box;
        }

        .avatar:hover {
            animation: bounceUpDown 0.45s ease-in-out infinite alternate;
            box-shadow: 0 0 16px rgba(20, 184, 166, 0.35);
        }

        @keyframes bounceUpDown {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-6px);
            }
        }

        .username {
            margin: 0 0 6px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--accent);
            text-shadow: 0 0 8px rgba(20, 184, 166, 0.35);
            cursor: default;
            transition: transform 0.2s ease, font-size 0.2s ease;
        }

        .username:hover {
            transform: scale(1.03);
            font-size: 0.98rem;
        }

        .bio {
            margin: 0 0 18px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text);
            opacity: 0.9;
            transition: transform 0.2s ease, font-size 0.2s ease;
            cursor: default;
        }

        .socials {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0;
        }

        .socials a {
            color: var(--text);
            font-size: 24px;
            transition: 0.3s;
        }

        .socials a:hover {
            color: var(--accent);
            transform: scale(1.2);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px 12px 10px 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(20, 184, 166, 0.7) transparent;
        }

        .links::-webkit-scrollbar {
            width: 8px;
        }

        .links::-webkit-scrollbar-track {
            background: transparent;
        }

        .links::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(20, 184, 166, 0.9), rgba(20, 184, 166, 0.45));
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 8px rgba(20, 184, 166, 0.25);
        }

        .link-item {
            display: flex;
            align-items: center;
            min-height: 50px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .link-item::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            padding: 1px;
            background: linear-gradient(var(--rotate, 132deg), #5ddcff, #14b8a6 43%, #0f766e);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .link-item::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 12px;
            border: 0px solid transparent;
            box-shadow: inset 0 0 0 1px rgba(20, 184, 166, 0.2);
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .link-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 14px rgba(20, 184, 166, 0.3);
        }

        .link-item:hover::before {
            opacity: 1;
        }

        .link-icon {
            width: 30px;
        }

        .link-text {
            flex: 1;
            text-align: center;
            font-weight: 600;
        }

        /* Toggle */
        .toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-soft);
            color: var(--accent);
            border-radius: 999px;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(20, 184, 166, 0.15);
            transition: 0.3s;
        }

        .toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 0 14px rgba(20, 184, 166, 0.25);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <button class="toggle" type="button" onclick="toggleTheme()" aria-label="Toggle theme">
        <i class="fas fa-adjust"></i>
    </button>

    <div class="container glass">
        <div class="sub-container">
            <img src="assets/avatar.jpg" class="avatar">
            <p class="username">@baguetty</p>
            <p class="bio">Hi, My name is Christ, Once Human grinder &amp; theorycrafter</p>

            <div class="socials">
                <a href="https://www.youtube.com/@baguetty"><i class="fab fa-youtube"></i></a>
                <a href="https://www.twitch.tv/christwhite96"><i class="fab fa-twitch"></i></a>
                <a href="https://discordapp.com/users/203894904907104257"><i class="fab fa-discord"></i></a>
            </div>

            <div class="links">
                <a href="https://thachvn0296.github.io/OHTimer/" class="link-item" target="_blank"
                    rel="noopener noreferrer">
                    <div class="link-icon"><i class="fas fa-robot"></i></div>
                    <div class="link-text">Once Human Discord's Reset Timer Bot - Invite Link</div>
                </a>

                <a href="https://github.com/thachvn0296/OHTimer" class="link-item" target="_blank"
                    rel="noopener noreferrer">
                    <div class="link-icon"><i class="fas fa-globe"></i></div>
                    <div class="link-text">Once Human Reset Timer Bot - Source Code</div>
                </a>

                <a href="https://oh-calculator.vercel.app/" class="link-item" target="_blank" rel="noopener noreferrer">
                    <div class="link-icon"><i class="fa-solid fa-wrench"></i></div>
                    <div class="link-text">Once Human - Damage Calculator</div>
                </a>

                <a href="https://thachvn0296.github.io/OH-Starfall-Daily-Tracker/OH%20Timer.html" class="link-item"
                    target="_blank" rel="noopener noreferrer">
                    <div class="link-icon"><i class="fa-solid fa-wrench"></i></div>
                    <div class="link-text">Once Human - S4 Starfall Daily Tracker</div>
                </a>

                <a href="https://docs.google.com/spreadsheets/d/1i2mwQgR5f7RE0r-GEv3peS3I6hh5LQtt/edit?gid=1880848336#gid=1880848336"
                    class="link-item" target="_blank" rel="noopener noreferrer">
                    <div class="link-icon"><i class="fas fa-file-lines"></i></div>
                    <div class="link-text">Once Human Ebook - General info and In-game Formulas</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        function applyTheme(theme) {
            document.body.classList.toggle('light', theme === 'light');
            localStorage.setItem('theme', theme);
            const toggleIcon = document.querySelector('.toggle i');
            if (toggleIcon) {
                toggleIcon.className = theme === 'light' ? 'fas fa-sun' : 'fas fa-adjust';
            }
        }

        function toggleTheme() {
            const isLight = document.body.classList.contains('light');
            applyTheme(isLight ? 'dark' : 'light');
        }

        const savedTheme = localStorage.getItem('theme');
        applyTheme(savedTheme === 'light' ? 'light' : 'dark');
    </script>

</body>

</html>
